# 在旧机 idol HTTPS server 内替换后台 include，静态 root 和其他站点不变。
# 与原后台 location 不能同时 include；本批不增加反向代理信任。
location = /admin { return 503; }
location ^~ /admin/ {
    default_type text/plain;
    add_header Retry-After 600 always;
    add_header Cache-Control "no-store" always;
    return 503 "服务迁移中，请稍后重试。\n";
}
location ^~ /api/v1/ {
    default_type text/plain;
    add_header Retry-After 600 always;
    add_header Cache-Control "no-store" always;
    return 503 "服务迁移中，请稍后重试。\n";
}
